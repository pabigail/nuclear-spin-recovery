[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuclear-spin-recovery"
version = "0.0.0"
description = "Bayesian recovery of nuclear spin configurations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "ase"]

[project.optional-dependencies]
dev = [
  "pytest", "pytest-cov", "ruff",
  "jupyterlab", "ipykernel", "jupytext", "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nuclear_spin_recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running statistical tests"]
# Put src/ on sys.path directly rather than relying on the editable install.
# macOS sets a hidden flag on .pth files under iCloud-synced directories, and
# CPython 3.12 silently skips hidden .pth files (site.py, UF_HIDDEN check),
# which makes the editable install disappear with no error but ModuleNotFound.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
